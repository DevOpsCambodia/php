[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

; ------------------------------------------------
; 1. Supervisord Configuration for PHP Process
; ------------------------------------------------
[program:php]
command=%(ENV_SUPERVISOR_PHP_COMMAND)s
user=%(ENV_SUPERVISOR_PHP_USER)s
environment=LARAVEL_SAIL="1"
priority=10
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ------------------------------------------------
; 2. Queue Worker = Default
; ------------------------------------------------
[program:laravel-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/artisan queue:work --sleep=1 --tries=3 --timeout=120 --memory=512 --backoff=5,10,30,60 --max-jobs=500 --max-time=3600
user=%(ENV_SUPERVISOR_PHP_USER)s
autostart=true
autorestart=true
startsecs=5
startretries=3
stopsignal=QUIT
stopasgroup=true
killasgroup=true
numprocs=1
stopwaitsecs=30
stdout_logfile=/dev/null
stderr_logfile=/var/www/html/storage/logs/worker.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5
priority=20

; ------------------------------------------------
; 3. Queue Worker = Notification
; ------------------------------------------------
[program:laravel-worker-notify]
process_name=%(program_name)s_%(process_num)02d
